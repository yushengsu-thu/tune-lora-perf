      command -v numactl >/dev/null 2>&1 || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq numactl; } || true
      pip install --quiet "huggingface_hub[hf_xet,hf_transfer]" hf_xet hf_transfer || true
      if [ -d /root/sglang/.git ]; then cd /root/sglang; else rm -rf /root/sglang; git clone https://github.com/yushengsu-thu/sglang /root/sglang; cd /root/sglang; fi
      log "reset to origin/main (oss)"; git fetch origin main && git reset --hard origin/main
