---
# GB300 port of the qwen e2e pod (TP4/EP4, 4 GPU, single node) for qwen_run_gb300.sh /
# qwen_base_gb300.sh. Derived from ../../regression/models/qwen35_gb300/pod.yaml — same
# cluster conventions (gcp-radixark-02, GKE, a4x-maxgpu-4g-metal / nvidia-gb300):
#   * NO runtimeClassName (GKE has no `nvidia` class) / NO privileged
#   * cohort toleration (free gb300 nodes carry radixark.io/cohort=true:NoSchedule)
#   * hostPath on /mnt/stateful_partition (95G persistent NVMe): /root/.cache (JIT cache —
#     kills the >30-min cold sm_103 trtllm_lora_temp build on relaunch) + /data (weights)
#   * image PINNED by digest + flashinfer re-pinned to 0.6.11.post1 in setup: the floating
#     dev-cu13 tag and the branch pyproject's flashinfer 0.6.12 both changed
#     get_sf_out_offset_* signatures -> trtllm_lora_temp JIT compile error on sm_103.
# Launch: ID=$(date +%Y%m%d-%H%M%S) envsubst < qwen-pod.yaml | kubectl --context gcp-radixark-02 apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: flo-qwen-gb300-yushengsu-${ID}
  labels:
    app: flo-qwen-gb300-yushengsu-${ID}
spec:
  tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
  # Free gb300 nodes carry this cohort-reservation taint — without it the pod stays Pending
  # even with idle GPUs. (Do NOT tolerate gpu-maintenance — those nodes are drained for a reason.)
  - key: "radixark.io/cohort"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  containers:
  - name: sglang
    # Pinned digest: PR's trtllm_lora_temp JIT compiles against this build's tensorrt_llm
    # headers (see header note). Re-pin/un-pin when the PR rebases onto current flashinfer.
    image: lmsysorg/sglang@sha256:97e7cd699dc879b56bc9f7a11f25c060fa4a6137e901a637f4378e9b01607a01
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - |
      set -e
      cat > /root/setup.sh <<'SETUP'
      #!/bin/bash
      set -o pipefail
      log(){ echo "[setup $(date -u +%H:%M:%S)] $*"; }
      log "ensuring numactl is present (keeps page cache off HBM NUMA nodes)"
      command -v numactl >/dev/null 2>&1 || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq numactl; } || true
      log "installing hf_xet + hf_transfer download accelerators"
      pip install --quiet "huggingface_hub[hf_xet,hf_transfer]" hf_xet hf_transfer || true
      if [ -f "$HOME/.cargo/env" ]; then grep -q 'cargo/env' ~/.bashrc 2>/dev/null || echo '. "$HOME/.cargo/env"' >> ~/.bashrc; . "$HOME/.cargo/env"; fi
      if [ -d /root/sglang/.git ]; then
        log "updating /root/sglang -> origin/main"; cd /root/sglang
        git remote set-url origin https://github.com/sgl-project/sglang.git 2>/dev/null || true
        git fetch origin main && git reset --hard origin/main
      else
        log "cloning sglang"; rm -rf /root/sglang && git clone https://github.com/sgl-project/sglang /root/sglang; cd /root/sglang
      fi
      log "pip install -e /root/sglang/python (a few minutes)"; cd /root/sglang && pip install -e python
      # The editable install pulls the pyproject's flashinfer 0.6.12 — re-pin to the version
      # matching the pinned image's flashinfer-jit-cache (run scripts re-check this per run).
      log "re-pinning flashinfer -> 0.6.11.post1 (matches image jit-cache)"
      pip install -q "flashinfer_python[cu13]==0.6.11.post1" "flashinfer_cubin==0.6.11.post1" || true
      mkdir -p /data/Qwen3.5-35B-A3B-FP8 /data/qwen35_35b_lora_alpha
      (
        flock 9
        if [ ! -f /data/Qwen3.5-35B-A3B-FP8/config.json ]; then
          log "downloading Qwen/Qwen3.5-35B-A3B-FP8 -> /data (persistent)"
          numactl --membind=0,1 hf download Qwen/Qwen3.5-35B-A3B-FP8 --local-dir /data/Qwen3.5-35B-A3B-FP8
        else log "reusing cached /data/Qwen3.5-35B-A3B-FP8"; fi
        if [ ! -f /data/qwen35_35b_lora_alpha/adapter_config.json ]; then
          log "downloading jybsuper/qwen35_35b_lora_alpha (private; needs HF_TOKEN; OK to fail — relay the adapter instead, see ../../regression/models/qwen35_gb300/MODEL.md)"
          numactl --membind=0,1 hf download jybsuper/qwen35_35b_lora_alpha --local-dir /data/qwen35_35b_lora_alpha || true
        else log "reusing cached /data/qwen35_35b_lora_alpha"; fi
      ) 9>/data/.qwen35-download.lock
      touch /root/.setup-done; log "setup complete"
      SETUP
      chmod +x /root/setup.sh
      ( /root/setup.sh > /root/setup.log 2>&1 ) &
      sleep infinity
    env:
    - name: PATH
      value: "/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: LD_LIBRARY_PATH
      value: "/usr/local/nvidia/lib64"
    - name: NVIDIA_DISABLE_REQUIRE
      value: "true"
    - name: MALLOC_TRIM_THRESHOLD_
      value: "131072"
    - name: HF_HUB_ENABLE_HF_TRANSFER
      value: "1"
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token-yanbin
          key: token
          optional: true
    resources:
      requests:
        nvidia.com/gpu: 4
        memory: "100Gi"   # scheduling reservation only — keep small; free nodes are tight
        cpu: "8"
        ephemeral-storage: "60Gi"
      limits:
        nvidia.com/gpu: 4
        memory: "850Gi"
        cpu: "64"
        ephemeral-storage: "1500Gi"
    volumeMounts:
    - name: shm
      mountPath: /dev/shm
    - name: dot-cache
      mountPath: /root/.cache
    - name: data
      mountPath: /data
  volumes:
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 128Gi
  - name: dot-cache
    hostPath:
      path: /mnt/stateful_partition/sglang-dot-cache
      type: DirectoryOrCreate
  - name: data
    hostPath:
      path: /mnt/stateful_partition/sglang-data
      type: DirectoryOrCreate
