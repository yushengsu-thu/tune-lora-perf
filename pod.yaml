apiVersion: v1
kind: Pod
metadata:
  name: sglang-yusheng
spec:
  tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: sglang
    image: lmsysorg/sglang:dev-cu13
    imagePullPolicy: Always
    command:
    - /bin/sh
    - -c
    - |
      mkdir -p /home/radixark/yushengsu /root/.ssh /run/sshd
      echo 'ssh-rsa  amd\yushensu@XSJYUSHENSU01' > /root/.ssh/authorized_keys
      chmod 700 /root/.ssh
      chmod 600 /root/.ssh/authorized_keys
      echo 'export PATH=$PATH:/usr/local/nvidia/bin:/usr/local/cuda/bin' >> /root/.bashrc
      echo 'export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:$LD_LIBRARY_PATH' >> /root/.bashrc
      ssh-keygen -A
      echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config
      /usr/sbin/sshd
      sleep infinity
    env:
    - name: PATH
      value: "/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: LD_LIBRARY_PATH
      value: "/usr/local/nvidia/lib64"
    resources:
      requests:
        memory: "512Gi"
        cpu: "32"
        ephemeral-storage: "800Gi"
      limits:
        nvidia.com/gpu: 4
        memory: "850Gi"
        cpu: "64"
        ephemeral-storage: "1500Gi"
    volumeMounts:
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 128Gi
