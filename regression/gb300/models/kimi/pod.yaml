---
# Kimi-K2.5-NVFP4 regression — GB300 (sm_103) 2-node MNNVL on gcp-radixark-02 (GKE).
# Port of gb200/models/kimi/pod.yaml with the GB300/GKE deltas:
#   * NO runtimeClassName / privileged (cluster conventions)
#   * cohort toleration (the FREE gb300 nodes carry radixark.io/cohort=true:NoSchedule)
#   * small scheduling requests (busy cluster) + big ephemeral limits (weights ~600G go to the
#     pod's ephemeral /root — backed by the node's 2.9T kube-ephemeral-ssd; re-downloaded per pod)
#   * /root/.cache hostPath on the node's 95G stateful partition (JIT/autotune cache persists;
#     weights do NOT fit there — kimi is ~600G vs 95G)
#   * image PINNED by digest (PR #27329 kernels need flashinfer 0.6.11-era headers, see qwen35 pack)
# ComputeDomain CRD (resource.nvidia.com) is installed on this cluster — MNNVL/IMEX via DRA.
apiVersion: v1
kind: Service
metadata:
  name: sglang-gb300-kimi-yushengsu-${ID}-head
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: sglang-gb300-kimi-yushengsu-${ID}
  ports:
  - name: dist-init
    port: 20000
    targetPort: 20000
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: sglang-gb300-kimi-yushengsu-${ID}-compute-domain
spec:
  numNodes: 0
  channel:
    resourceClaimTemplate:
      name: sglang-gb300-kimi-yushengsu-${ID}-cd-channel
---
apiVersion: v1
kind: Pod
metadata:
  name: sglang-gb300-kimi-yushengsu-${ID}-0
  labels:
    app: sglang-gb300-kimi-yushengsu-${ID}
    sglang-role: head
spec:
  hostname: sglang-gb300-kimi-yushengsu-${ID}-0
  subdomain: sglang-gb300-kimi-yushengsu-${ID}-head
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: sglang-gb300-kimi-yushengsu-${ID}
        topologyKey: kubernetes.io/hostname
  resourceClaims:
  - name: imex-channel
    resourceClaimTemplateName: sglang-gb300-kimi-yushengsu-${ID}-cd-channel
  tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "radixark.io/cohort"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  containers:
  - name: sglang
    image: lmsysorg/sglang@sha256:97e7cd699dc879b56bc9f7a11f25c060fa4a6137e901a637f4378e9b01607a01
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - |
      set -e
      cat > /root/setup.sh <<'SETUP'
      #!/bin/bash
      set -o pipefail
      log(){ echo "[setup $(date -u +%H:%M:%S)] $*"; }
      command -v numactl >/dev/null 2>&1 || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq numactl; } || true
      pip install --quiet "huggingface_hub[hf_xet,hf_transfer]" hf_xet hf_transfer || true
      if [ -f "$HOME/.cargo/env" ]; then grep -q 'cargo/env' ~/.bashrc 2>/dev/null || echo '. "$HOME/.cargo/env"' >> ~/.bashrc; . "$HOME/.cargo/env"; fi
      if [ -d /root/sglang/.git ]; then
        cd /root/sglang; git remote set-url origin https://github.com/sgl-project/sglang.git 2>/dev/null || true
        # Pinned baseline: the PR #27329 merge commit on sgl-project main.
        git fetch origin c9f582a272dcc7109bf7da584867f47995602035 && git reset --hard c9f582a272dcc7109bf7da584867f47995602035
      else
        rm -rf /root/sglang && git clone https://github.com/sgl-project/sglang /root/sglang; cd /root/sglang
        git fetch origin c9f582a272dcc7109bf7da584867f47995602035 && git reset --hard c9f582a272dcc7109bf7da584867f47995602035
      fi
      cd /root/sglang && pip install -e python
      # Weights -> ephemeral /root (backed by the node's 2.9T local SSD; ~600G, re-downloaded
      # per pod — they do NOT fit the 95G stateful partition that holds the JIT cache).
      mkdir -p /root/Kimi-K2.5-NVFP4 /root/kimi_k25_lora_alpha
      if [ ! -f /root/Kimi-K2.5-NVFP4/config.json ]; then
        log "downloading nvidia/Kimi-K2.5-NVFP4 (~600G, a while)"
        numactl --membind=0,1 hf download nvidia/Kimi-K2.5-NVFP4 --local-dir /root/Kimi-K2.5-NVFP4
      fi
      if [ ! -f /root/kimi_k25_lora_alpha/adapter_config.json ]; then
        log "downloading jybsuper/kimi_k25_lora_alpha (private; needs HF_TOKEN; OK to fail — see MODEL.md)"
        numactl --membind=0,1 hf download jybsuper/kimi_k25_lora_alpha --local-dir /root/kimi_k25_lora_alpha || true
      fi
      touch /root/.setup-done; log "setup complete"
      SETUP
      chmod +x /root/setup.sh
      ( /root/setup.sh > /root/setup.log 2>&1 ) &
      sleep infinity
    ports:
    - name: dist-init
      containerPort: 20000
      protocol: TCP
    env:
    - name: PATH
      value: "/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: LD_LIBRARY_PATH
      value: "/usr/local/nvidia/lib64"
    - name: NVIDIA_DISABLE_REQUIRE
      value: "true"
    - name: MALLOC_TRIM_THRESHOLD_
      value: "131072"
    - name: HF_HUB_ENABLE_HF_TRANSFER
      value: "1"
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token-yanbin
          key: token
          optional: true
    resources:
      requests:
        nvidia.com/gpu: 4
        memory: "100Gi"
        cpu: "8"
        ephemeral-storage: "200Gi"
      limits:
        nvidia.com/gpu: 4
        memory: "850Gi"
        cpu: "64"
        ephemeral-storage: "2000Gi"
      claims:
      - name: imex-channel
    volumeMounts:
    - name: shm
      mountPath: /dev/shm
    - name: dot-cache
      mountPath: /root/.cache
  volumes:
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 128Gi
  - name: dot-cache
    hostPath:
      path: /mnt/stateful_partition/sglang-dot-cache
      type: DirectoryOrCreate
---
